name: macOS build

on:
  push:
    branches: [main, community/macos-apple-silicon, codex/macos-0.7.2-alpha]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "build.rs", "assets/**", "packaging/macos/**", ".github/workflows/macos.yml"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.100.0"

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build and package
        run: |
          bundle=$(bash packaging/macos/build-app.sh)
          test "$(lipo -archs "$bundle/Contents/MacOS/streamtube")" = arm64
          version=$(cargo metadata --format-version 1 --no-deps --locked | plutil -extract packages.0.version raw -o - -)
          archive="StreamTube-$version-macos-arm64-UNOFFICIAL.zip"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          (cd dist && shasum -c "$archive.sha256")

      - name: Test
        run: cargo test --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*-macos-arm64-UNOFFICIAL.zip*
          if-no-files-found: error

  provenance:
    needs: macos
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
