name: macOS build

on:
  push:
    branches: [main]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "build.rs", "packaging/macos/**", ".github/workflows/macos.yml"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  macos:
    # Apple Silicon; the .app carries Homebrew's libmpv and FFmpeg (packaging/macos/build-app.sh)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: libmpv and packaging tools
        run: brew install mpv dylibbundler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        id: pkg
        run: |
          packaging/macos/build-app.sh
          echo "dmg=$(ls dist/*.dmg)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ steps.pkg.outputs.dmg }}
