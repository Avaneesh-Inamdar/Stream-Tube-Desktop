name: Update Nix Flake on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to process (e.g. v0.7.3-alpha)"
        required: false
        type: string
      branch:
        description: "Branch to update"
        required: true
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write # For attestations if needed

jobs:
  update-flake-on-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            echo "No release tag found"
            exit 1
          fi

          # Validate tag format
          if [[ ! "$TAG" =~ ^v.+ ]]; then
            echo "Tag must start with 'v', got: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Create update branch
        run: |
          BRANCH="chore/update-nix-flake-${{ steps.tag.outputs.version }}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        id: branch

      - name: Download release asset and compute SHA256
        id: sha256
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"

          # Download the Linux release tarball
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/StreamTube-${VERSION}-linux-x86_64.tar.gz"
          echo "Downloading from: $URL"

          # Download with curl, follow redirects
          curl -sSLf "$URL" -o streamtube-release.tar.gz || {
            echo "Failed to download release asset from $URL"
            echo "Checking if asset exists..."
            gh release view "$TAG" --json assets --jq '.assets[].name'
            exit 1
          }

          # Compute SHA256 in Nix format
          SHA256=$(nix-hash --type sha256 --base32 streamtube-release.tar.gz)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Computed SHA256: $SHA256"

      - name: Update flake.nix with new version and SHA256
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"

          # Update version
          sed -i "s/version = \".*\";/version = \"$VERSION\";/" flake.nix

          # Update SHA256
          sed -i "s|sha256 = \".*\";|sha256 = \"$SHA256\";|" flake.nix

          echo "Updated flake.nix with version=$VERSION and sha256=$SHA256"

      - name: Update flake.lock
        run: |
          nix flake update

      - name: Verify build works
        run: |
          nix build .#checks.x86_64-linux.check --impure

      - name: Commit changes
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          VERSION="${{ steps.tag.outputs.version }}"

          git add flake.nix flake.lock
          git commit -m "chore(nix): update to v$VERSION

          - Update version to $VERSION
          - Update SHA256 for Linux release binary
          - Update flake.lock inputs"
          git push origin "$BRANCH"

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          VERSION="${{ steps.tag.outputs.version }}"

          gh pr create \
            --title "chore(nix): update flake to v$VERSION" \
            --body "Automated update from release v$VERSION.

            Changes:
            - Updated version to \`$VERSION\`
            - Updated SHA256 for Linux release binary
            - Updated flake.lock inputs to latest nixpkgs/flake-utils" \
            --base ${{ github.event.inputs.branch || 'main' }} \
            --head "$BRANCH"
